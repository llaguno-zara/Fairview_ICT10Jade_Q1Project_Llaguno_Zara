<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project | SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
         .container{
            background-color: rgb(198, 152, 89);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            width: 500px;
            justify-content: center;
        }

        body{
            background-color: rgb(107, 62, 30);
        }

        footer{
            padding-top: 10px;
			height: 40px;
			width: 100%;
			background-color: rgb(170, 115, 56);
			color: #fff5c6;
			text-align: center;
            font-weight: bold;
			position: fixed;
        }
    </style>
</head>
<body>
   <nav class="navbar navbar-expand-lg" style="background-color: #fff5c6;">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link">Skewer</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="sku.html">SKU Generator</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Receipt Generator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="header1">
            <h1>Coffee Shop!!!</h1>
        </div>

        <br>

        <label for="category">Category</label>
        <br>
        <select id="category">
            <option>Choose a Category</option>
            <option>Beverages</option>
            <option>Add Ons</option>
        </select>   

        <br><br>

        <label for="product">Product Name</label>
        <br>
        <input type="text" id="prod" name="product" placeholder="ex. Croissant" required>

        <br><br>

        <label for="stock">Stock Quantity</label>
        <br>
        <input type="number" id="stock" name="stock" placeholder="ex. 32" required>

        <br><br>

        <button type="button" py-click="display_char" id="btn">Generate SKU</button>

        <hr>

        <div id="output1">
            <p>Your generated SKU will appear here:</p>
            <script type="py" src="sku.py"></script>
        </div>
    </div>

    <footer>
        <b>SKU Generator - 1st Quarter Project</b>
    </footer>
</body>
</html>
